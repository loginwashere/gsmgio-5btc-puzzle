[package]
name = "crib_csp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crib_csp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
