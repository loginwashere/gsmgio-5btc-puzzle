services:
  # GSMG AES/KDF GPU oracle. Build: `docker compose build`. Self-test:
  # `docker compose run --rm gpu-oracle --self-test`. Real sweep:
  # `docker compose run --rm gpu-oracle --wordlist /data/wordlists/<file>.txt
  #    --checkpoint /data/checkpoints/<name>.checkpoint --output /data/output/<name>.jsonl`
  gpu-oracle:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: gsmg-gpu-oracle:latest
    runtime: nvidia
    init: true
    command: ["--help"]

    volumes:
      - ./output:/data/output
      - ./checkpoints:/data/checkpoints
      # Point this at the repo's own wordlists/gsmg/ so existing candidate
      # corpora (curated_v2_core.txt etc.) are directly usable without copying.
      - ../../wordlists:/data/wordlists

    working_dir: /data

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
