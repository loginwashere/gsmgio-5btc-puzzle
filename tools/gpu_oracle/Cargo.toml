[package]
name = "gpu_oracle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gpu_oracle"
path = "src/main.rs"

[features]
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19", features = ["cuda-12080"], optional = true }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rayon = "1.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
