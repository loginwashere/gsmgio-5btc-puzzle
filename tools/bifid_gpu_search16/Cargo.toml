[package]
name = "bifid_gpu_search16"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bifid_gpu_search16"
path = "src/main.rs"

[features]
cuda = ["dep:cudarc"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
cudarc = { version = "0.19", features = ["cuda-12080"], optional = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
