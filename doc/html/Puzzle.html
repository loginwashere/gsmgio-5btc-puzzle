<!doctype html>
<html lang="en">
<head>
<title>GSMG | GSMG</title>
<meta charset="utf-8">
<link rel="icon" href="/img/favicon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="GSMG">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    @font-face { font-family: "Roboto"; font-style: normal; font-weight: 400; src: url("font/roboto-400.ttf") format("truetype"); }
    html {box-sizing: border-box;overflow-x: hidden;overflow-y: scroll;font-size: 14px;text-rendering: optimizeLegibility;-webkit-text-size-adjust: 100%;}
    * { box-sizing: inherit; margin: 0; padding: 0; }
    body {display: flex;flex-direction: column;min-height: 100vh;background: #fafafa;color: rgba(0, 0, 0, 0.87);font-family: "Roboto", sans-serif;line-height: 1.5;}
    .content {flex: 1 0 auto;max-width: 100%;padding: 56px 0 79px;}
    .container {width: 100%;max-width: 1200px;margin: auto;padding: 24px;}
    .puzzle-card {width: 100%;border-radius: 2px;background-color: #fff;box-shadow: 0 3px 1px -2px rgba(0, 0, 0, 0.2),0 2px 2px 0 rgba(0, 0, 0, 0.14),0 1px 5px 0 rgba(0, 0, 0, 0.12);}
    .puzzle-card__header {display: flex;align-items: center;flex-wrap: wrap;padding: 24px 16px 16px;}
    .puzzle-title {font-size: 24px;font-weight: 400;line-height: 32px;}
    .puzzle-card__image {padding: 16px;}
    @media (min-width: 600px) {.puzzle-card {width: 50%;margin-left: 25%;}}
    @media (min-width: 960px) {.puzzle-card {width: 33.33333333333333%;margin-left: 33.33333333333333%;}}
    @media (max-width: 959px) {.container {padding: 16px;}}
</style></head>

<body>
    <main class="content">
        <div class="container">
            <section class="puzzle-card" aria-labelledby="puzzle-title">
                <header class="puzzle-card__header">
                    <h1 id="puzzle-title" class="puzzle-title">GSMG MEGANIGMA || 5 BTC</h1>
                </header>
                <figure class="puzzle-card__image">
                    <img src="img/follow_the_white_rabbit.png" alt="Follow the white rabbit">
                </figure>
            </section>
        </div>
    </main>
</body>
</html>
